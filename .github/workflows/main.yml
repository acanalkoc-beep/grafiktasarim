name: Windows EXE Olustur

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Kodları Al
      uses: actions/checkout@v4

    - name: Python'u Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Eklentileri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: EXE'ye Donustur
      run: |
        pyinstaller --onefile --windowed app_main.py

    - name: EXE Dosyasini Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: Program-Windows-EXE
        path: dist/*.exe
